aid: signos
name: Signos
description: 'Signos is a metabolic health technology company founded by Sharam Fouladgar-Mercer
  and Bill Tancer that pairs a continuous glucose monitor (CGM) sensor with an AI-powered
  mobile app to help people understand their individual metabolic responses to food and
  make data-driven lifestyle changes for weight management. In August 2025 Signos received
  FDA clearance as the first over-the-counter glucose monitoring system for weight loss,
  making it available without a prescription to adults not on insulin. The platform integrates
  with the Dexcom Stelo sensor, Apple Health, Google Health Connect, smartwatches and smart
  scales, delivers real-time glucose insights, personalized meal and movement recommendations,
  registered-dietitian support, and daily and weekly metabolism scores, with optional GLP-1
  medication access through partner healthcare providers. Signos was surfaced as a portfolio
  company of GV (Google Ventures). It is a consumer-facing product and does not currently
  publish a developer API, SDK, or developer portal.'
